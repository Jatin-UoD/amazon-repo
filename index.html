<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HomePilot</title>
<style>
:root{--bg:#050d1f;--cd:#0a1a3a;--cd2:#0e2349;--tx:#eef4ff;--mu:#8ea4cc;--ac:#1e90ff;--cy:#22d3ee;--ok:#2ed589;--bd:#16305f;--bad:#ff6b70;--wn:#ffb02e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef3fb;--cd:#fff;--cd2:#e9f1ff;--tx:#0d1a33;--mu:#5b6a86;--ac:#1a7fe8;--cy:#0e9bb5;--ok:#13a964;--bd:#d3deef;--bad:#d93a40;--wn:#c47b00}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--ac) 22%,var(--bg)),var(--bg));background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:14px 16px 96px}
h1{font-size:20px;margin:0}h2{font-size:14px;margin:16px 0 8px;font-weight:600}.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bk{background:none;color:var(--tx);padding:4px 8px;font-size:20px;min-height:0}
.cd{background:linear-gradient(160deg,var(--cd2),var(--cd));border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:12.5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ic{font-size:21px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
button,select,input{font:inherit;color:var(--tx)}button{background:linear-gradient(90deg,var(--ac),var(--cy));color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:40px}
button.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}button.on{background:linear-gradient(90deg,var(--ac),var(--cy))}button.bad{background:var(--bad)}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=time],select{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px;width:100%;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2;cursor:pointer}.sw i{position:absolute;inset:0;background:var(--bd);border-radius:13px;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:23px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;max-width:430px;width:100%}nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:11px;padding:8px 2px}nav button.on{color:var(--cy);background:none}nav b{display:block;font-size:19px;font-weight:400}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}.tag.s{color:var(--wn);border-color:var(--wn)}.tag.ok{color:var(--ok);border-color:var(--ok)}
.tabs{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}.tabs button{flex:1;background:none;color:var(--mu);padding:7px 4px;min-height:32px;font-size:13px}.tabs button.on{background:var(--ac);color:#fff}
.big{font-size:26px;font-weight:700}.bar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--cy))}
.m{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.m>div{background:var(--bg);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:16px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:12px;z-index:20;max-width:90%;font-size:13px}
.bub{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:85%}.u{background:var(--ac);color:#fff;margin-left:auto}.a{background:var(--cd);border:1px solid var(--bd)}
svg{width:100%;display:block}.chip{display:inline-block;border:1px solid var(--ac);color:var(--cy);border-radius:10px;padding:7px 10px;margin:0 6px 6px 0;font-size:13px;background:transparent;min-height:0}
.tile{text-align:center;cursor:pointer;padding:10px 4px}.tile .ic{margin:0 auto 4px}.lnk{cursor:pointer}.chev:after{content:"›";color:var(--mu);font-size:20px;margin-left:6px}
.logo{font-size:34px;font-weight:800}.logo span{color:var(--cy)}@keyframes pl{50%{opacity:.3}}.dot{animation:pl 1.2s infinite}
</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROOMS=["Living Room","Bedroom","Kitchen","Others"],IC={light:"💡",fan:"🌀",ac:"❄️",tv:"📺",plug:"🔌",geyser:"♨️",curtain:"🪟",washer:"🧺",pump:"💧"},COL={light:"#f5b50a",fan:"#22d3ee",ac:"#3b82f6",tv:"#a855f7",plug:"#22c55e",geyser:"#f97316",curtain:"#94a3b8",washer:"#60a5fa",pump:"#38bdf8"};
const CAPS={light:["on","level"],fan:["on","speed"],ac:["on","temp","mode"],tv:["on","vol"],plug:["on"],geyser:["on"],curtain:["pos"],washer:[],pump:["on"]};
const NEED={washer:"Status/control needs a washer with a supported smart integration (vendor API or Matter). Not available in this demo.",geyser:"On/off only. A mains-rated relay and independent thermostat/overheat cut-off are required; no temperature control is claimed."};
let tab="home",sub=null,sa=null,stack=[],fq="",rf="All",chat=[],pc=null,live=[],rg="Day",csv=null,ana2="Analytics",at="Automation",nf="All",lt="Power",acc=null,rt2="Events",pt="Scan QR",au="splash",dl="All";
const uid=()=>Math.random().toString(36).slice(2,9),dev=id=>S.dev.find(d=>d.id===id);
const rnd=(n,a,b)=>Array.from({length:n},()=>+(a+Math.random()*(b-a)).toFixed(2));
function seed(){const D=(name,room,type,o={})=>({id:uid(),name,room,type,on:false,online:true,fav:false,level:70,speed:3,temp:24,mode:"cool",vol:20,pos:50,...o});
return{theme:"dark",role:"owner",tariff:8,user:null,acct:null,home:"My Home",
dev:[D("Living Room Light","Living Room","light",{on:true,level:75,fav:true}),D("Ceiling Fan","Living Room","fan",{on:true,fav:true}),D("TV","Living Room","tv"),D("Curtains","Living Room","curtain"),
D("Bedroom AC","Bedroom","ac",{on:true,fav:true}),D("Bedroom Fan","Bedroom","fan"),D("Bedroom Light","Bedroom","light"),
D("Refrigerator Plug","Kitchen","plug",{on:true}),D("Geyser","Kitchen","geyser"),D("Washing Machine","Others","washer",{online:false}),D("Water Pump","Others","pump")],
kwh:{},base:{Day:rnd(24,0.2,1.1),Week:rnd(7,8,15),Month:rnd(30,7,16),Year:rnd(12,200,320)},timers:{},
water:{lvl:70,auto:true,lo:20,hi:95,run:0,limit:150},
rules:[{id:uid(),name:"Morning Routine",type:"time",val:"07:00",act:"morning",en:true},{id:uid(),name:"Night Mode",type:"time",val:"22:00",act:"night",en:true},{id:uid(),name:"Motion Light (Ring demo)",type:"ring",val:"",act:"ringlight",en:true},{id:uid(),name:"High Usage Alert",type:"power",val:3000,act:"notify",en:true}],
members:[{n:"Jatin Sharma",r:"owner"}],notes:[],cmds:[],acts:[],ring:[]}}
let S=(()=>{try{return JSON.parse(localStorage.getItem("hp2"))}catch(e){return null}})()||seed();
const save=()=>{try{localStorage.setItem("hp2",JSON.stringify(S))}catch(e){}};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}
const note=(t,k)=>{S.notes.unshift({t:Date.now(),x:t,k:k||"info"});S.notes.length=Math.min(S.notes.length,60);save()};
const go=(s,a)=>{stack.push([sub,sa]);sub=s;sa=a;draw();scrollTo(0,0)},bk=()=>{[sub,sa]=stack.pop()||[null,null];draw()},nav=t=>{tab=t;sub=null;stack=[];draw()};
function watts(d){if(!d.on||!d.online)return 0;return{light:10*d.level/100,fan:[0,12,20,32,48,62][d.speed],ac:1100+(30-d.temp)*40,tv:90,plug:140,geyser:2000,pump:750}[d.type]||0}
function cmd(id,p,label,cb){const d=dev(id);cb=cb||(()=>{});
if(S.role==="viewer"){toast("Viewer role cannot control devices");note("Denied: "+label+" (viewer role)","warn");cb(false,"permission denied");return}
if(!Object.keys(p).every(k=>CAPS[d.type].includes(k))){toast(d.name+" does not support that control");cb(false,"unsupported capability");return}
if(!d.online){note(d.name+": "+label+" failed (offline)","warn");toast(d.name+" is offline");cb(false,"device offline");return}
const c={id:uid(),x:d.name+": "+label,st:"pending",t:Date.now()};S.cmds.unshift(c);S.cmds.length=30;draw();
setTimeout(()=>{Object.assign(d,p);c.st="confirmed";save();draw();cb(true)},450)}
const tg=id=>{const d=dev(id);cmd(id,{on:!d.on},d.on?"off":"on")},setv=(id,k,v)=>cmd(id,{[k]:+v},k+" "+v);
const SC={night:()=>S.dev.forEach(d=>{if(d.type==="light"&&d.on)cmd(d.id,{on:false},"off");if(d.type==="fan"&&d.room==="Bedroom")cmd(d.id,{on:true,speed:1},"speed 1");if(d.type==="ac")cmd(d.id,{on:true,temp:26},"26°C")}),
morning:()=>S.dev.forEach(d=>{if(d.type==="light"&&d.room==="Living Room")cmd(d.id,{on:true,level:80},"80%");if(d.type==="curtain")cmd(d.id,{pos:100},"open")}),
away:()=>S.dev.forEach(d=>{if(d.on&&d.type!=="plug"&&CAPS[d.type].includes("on"))cmd(d.id,{on:false},"off")}),
lightsoff:()=>S.dev.forEach(d=>d.type==="light"&&d.on&&cmd(d.id,{on:false},"off")),
movie:()=>S.dev.forEach(d=>{if(d.type==="light"&&d.room==="Living Room")cmd(d.id,{on:true,level:20},"20%");if(d.type==="tv")cmd(d.id,{on:true},"on")}),
ringlight:()=>S.dev.filter(d=>d.type==="light"&&d.room==="Living Room").forEach(d=>cmd(d.id,{on:true,level:100},"Ring motion routine")),
notify:()=>note("High power usage detected","warn")};
const SN={night:"Night Mode",morning:"Morning Routine",away:"Away",lightsoff:"All Lights Off",movie:"Movie Time"};
function run(r,src){const now=Date.now();if(r.last&&now-r.last<20000)return;r.last=now;if(r.act.startsWith("dev:")){const[,id,v]=r.act.split(":");dev(id)&&cmd(id,{on:v==="on"},v)}else SC[r.act]&&SC[r.act]();S.acts.unshift({t:now,x:r.name+" ("+src+")"});S.acts.length=30;note("Automation ran: "+r.name,"auto")}
function ringEvent(kind,src){kind=kind||"motion";src=src||"in-app demo";const db=kind==="doorbell";S.ring.unshift({id:uid(),t:Date.now(),x:db?"Doorbell Pressed":"Motion Detected",w:"Front Door",src});S.ring.length=15;note("Ring "+(db?"doorbell":"motion")+" ("+src+"): Front Door","ring");if(!db)S.rules.filter(r=>r.en&&r.type==="ring").forEach(r=>run(r,"ring "+src));save();draw()}
let pendingCode=null,pendingNew=false,rcv="";
const bus=m=>{try{localStorage.setItem("hp_bus",JSON.stringify({n:Math.random(),from:"app",...m}))}catch(e){}};
addEventListener("storage",e=>{if(e.key!=="hp_bus"||!e.newValue)return;let m;try{m=JSON.parse(e.newValue)}catch(x){return}if(m.from!=="ring")return;
if(m.type==="paired"&&pendingCode&&m.code===pendingCode){S.ringPair={code:m.code,name:m.name||"Ring Doorbell (demo)",t:Date.now()};pendingCode=null;rcv="";note("Ring demo device synced","ring");save();toast("Ring synced (demo)");draw()}
else if(m.type==="event"&&S.ringPair&&m.code===S.ringPair.code)ringEvent(m.kind,"paired Ring demo device");
else if(m.type==="unpair"&&S.ringPair&&m.code===S.ringPair.code){S.ringPair=null;note("Ring demo device unpaired","warn");save();toast("Ring device unpaired");draw()}
else if(m.type==="code"){if(S.ringPair&&S.ringPair.code===m.old){S.ringPair=null;note("Ring device unpaired (new code generated)","warn")}if(pendingNew){pendingNew=false;rcv=m.code;toast("New Ring code: "+m.code)}save();draw()}});
function syncRing(){if(S.role==="viewer")return toast("Viewer role cannot pair devices");const c=$("#rc").value.trim().toUpperCase();if(!/^RING-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c))return toast("Code looks like RING-AB12-CD34");pendingCode=c;bus({type:"pair",code:c});toast("Looking for Ring device...");setTimeout(()=>{if(pendingCode===c){pendingCode=null;toast("No Ring device answered. Is ring.html open in another tab?")}},3000)}
function newRingCode(){if(S.role==="viewer")return toast("Viewer role cannot pair devices");pendingNew=true;bus({type:"newcode"});toast("Asking Ring device for a new code...");setTimeout(()=>{if(pendingNew){pendingNew=false;toast("No Ring device answered. Open ring.html in another tab first.")}},3000)}
function unRing(){if(S.ringPair)bus({type:"unpair",code:S.ringPair.code});S.ringPair=null;save();draw()}
function ringPairCard(){const P=S.ringPair,w='<div class="mu" style="margin-top:8px">Demo only: syncs with the Ring Demo Device page (ring.html) in the same browser. NOT a real Amazon Ring connection. Real Ring needs approved partner access, OAuth and a webhook server.</div>';
return P?`<div class="cd"><div class="row"><div class="ic" style="background:#2ed58926">✅</div><div class="sp"><b>${esc(P.name)}</b><div class="mu">Synced · code ${esc(P.code)}</div></div><span class="tag s">demo</span></div><div class="row" style="margin-top:8px"><button class="o sp" onclick="unRing()">Unpair</button><button class="o sp" onclick="newRingCode()">New code</button></div>${w}</div>`:`<div class="cd"><b>Sync your Ring</b><div class="mu" style="margin:4px 0 8px">1. Open <a style="color:var(--cy)" href="ring.html" target="_blank" rel="noopener">ring.html</a> (Ring Demo Device) in another tab.<br>2. Copy the pairing code shown there.<br>3. Enter it here.</div><input type="text" id="rc" placeholder="RING-XXXX-XXXX" autocapitalize="characters" style="text-transform:uppercase" value="${esc(rcv)}"><button style="width:100%" onclick="syncRing()">Sync Ring</button><button class="o" style="width:100%;margin-top:8px" onclick="newRingCode()">Get new code from Ring device</button>${w}</div>`}
let lastT=Date.now();
function tick(){const now=Date.now(),dt=(now-lastT)/1000;lastT=now;let tot=0;
S.dev.forEach(d=>{const w=watts(d);tot+=w;S.kwh[d.id]=(S.kwh[d.id]||0)+w*dt*60/3.6e6});
live.push({t:now,w:tot,v:230+Math.random()*5-2.5});if(live.length>60)live.shift();
const W=S.water,p=S.dev.find(d=>d.type==="pump");
if(p.on){W.lvl=Math.min(100,W.lvl+1.1);W.run+=dt*60;if(W.run>=W.limit*60){p.on=false;note("Pump stopped: runtime limit reached","warn")}}else{W.lvl=Math.max(0,W.lvl-0.25);W.run=0}
if(W.auto){if(W.lvl<=W.lo&&!p.on){p.on=true;note("Pump auto-started at "+W.lvl.toFixed(0)+"% (simulated)")}if(W.lvl>=W.hi&&p.on){p.on=false;note("Water tank full, pump stopped (simulated)")}}
if(W.lvl>=99.5&&p.on){p.on=false;note("Overflow protection: pump stopped","warn")}
Object.entries(S.timers).forEach(([id,e])=>{if(now>=e){delete S.timers[id];dev(id)&&cmd(id,{on:false},"timer off")}});
const h=new Date(),hm=String(h.getHours()).padStart(2,"0")+":"+String(h.getMinutes()).padStart(2,"0");
S.rules.forEach(r=>{if(!r.en)return;if(r.type==="time"&&r.val===hm&&r.fired!==hm){r.fired=hm;run(r,"schedule")}if(r.type==="power"&&tot>+r.val)run(r,"power "+tot.toFixed(0)+" W")});
save();if(S.user&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))draw()}
const kwhTot=()=>Object.values(S.kwh).reduce((a,b)=>a+b,0),sum=a=>a.reduce((x,y)=>x+y,0);
function area(a,c){c=c||"#2ea0ff";if(a.length<2)return'<div class="mu">Collecting readings...</div>';const mx=Math.max(...a)||1,mn=Math.min(...a),r=mx-mn||1,l=a.map((v,i)=>(i*300/(a.length-1)).toFixed(1)+","+(70-(v-mn)/r*60).toFixed(1)).join(" ");
return`<svg viewBox="0 0 300 80" preserveAspectRatio="none" style="height:130px"><defs><linearGradient id="g${c.slice(1)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".5"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon points="0,80 ${l} 300,80" fill="url(#g${c.slice(1)})"/><polyline points="${l}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="row mu"><span>min ${mn.toFixed(1)}</span><span class="sp"></span><span>max ${mx.toFixed(1)}</span></div>`}
const ic=t=>`<div class="ic" style="background:${COL[t]}26">${IC[t]}</div>`;
const sw=d=>CAPS[d.type].includes("on")?`<label class="sw"><input type="checkbox" ${d.on?"checked":""} ${d.online?"":"disabled"} onchange="tg('${d.id}')" aria-label="toggle ${esc(d.name)}"><i></i></label>`:"";
const stat=d=>!d.online?"Offline":(d.on?"On":"Off")+(d.type==="light"&&d.on?" · "+d.level+"%":"")+(d.type==="fan"&&d.on?" · Speed "+d.speed:"")+(d.type==="ac"&&d.on?" · "+d.temp+"°C · "+d.mode+" mode":"");
const hd=(t,r)=>`<div class="hd">${sub?'<button class="bk" onclick="bk()" aria-label="Back">←</button>':""}<h1>${t}</h1><span class="sp"></span>${r||""}</div>`;
const tabs=(a,c,f)=>`<div class="tabs">${a.map(x=>`<button class="${x===c?"on":""}" onclick="${f}('${x}')">${x}</button>`).join("")}</div>`;
function rowCard(d,inline){let x=`<div class="cd"><div class="row">${ic(d.type)}<div class="sp lnk" onclick="go('dev','${d.id}')"><b>${esc(d.name)}</b><div class="mu">${d.room} · ${stat(d)}</div></div>${sw(d)}</div>`;
if(inline&&d.online&&d.type==="light")x+=`<input type="range" min="5" max="100" value="${d.level}" onchange="setv('${d.id}','level',this.value)" style="margin-top:8px">`;
if(inline&&d.online&&d.type==="fan")x+=`<input type="range" min="1" max="5" step="1" value="${d.speed}" onchange="cmd('${d.id}',{on:true,speed:+this.value},'speed '+this.value)" style="margin-top:8px">`;
return x+"</div>"}
// ---- views
function splashV(){return`<div style="text-align:center;padding-top:30px"><svg viewBox="0 0 200 130" style="max-width:260px;margin:auto"><path d="M20 70 100 12l80 58" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/><rect x="40" y="62" width="120" height="58" rx="6" fill="#0e2349" stroke="#1e90ff" stroke-width="3"/><rect x="56" y="78" width="26" height="22" fill="#f5b50a" opacity=".85"/><rect x="118" y="78" width="26" height="22" fill="#f5b50a" opacity=".85"/><path d="M88 50a18 18 0 0 1 24 0M93 56a11 11 0 0 1 14 0" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div class="logo">Home<span>Pilot</span></div><div style="font-size:22px;font-weight:700;margin-top:26px">Smarter Home<br>Brighter Future</div><p class="mu" style="margin:14px 20px 26px">Control your devices, monitor energy, keep your home safe, all in one app.</p><button style="width:100%;font-size:16px" onclick="au='signup';draw()">Get Started</button><p class="mu">Already have an account? <a href="#" style="color:var(--cy)" onclick="au='signin';draw();return false">Sign in</a></p></div>`}
function authV(){const up=au==="signup";return`<div style="padding-top:20px"><div class="logo" style="font-size:22px">🏠 Home<span>Pilot</span></div><h1 style="font-size:26px;margin-top:20px">${up?"Create your household":"Welcome Back"}</h1><p class="mu">${up?"Set up your account and household on this device":"Sign in to your account"}</p>${up?'<input type="text" id="n" placeholder="Your name"><input type="text" id="h" placeholder="Household name (e.g. My Home)">':""}<input type="email" id="e" placeholder="Email or phone" autocomplete="username"><input type="password" id="p" placeholder="Password (min 6 characters)" autocomplete="${up?"new-password":"current-password"}"><button style="width:100%" onclick="doAuth()">${up?"Create Account":"Sign In"}</button><p class="mu" style="text-align:center">${up?"Have an account?":"Do not have an account?"} <a href="#" style="color:var(--cy)" onclick="au='${up?"signin":"signup"}';draw();return false">${up?"Sign in":"Create Account"}</a></p><p class="mu">Accounts are stored only on this device (password is hashed). No server or API is used.</p></div>`}
async function doAuth(){const e=$("#e").value.trim(),p=$("#p").value;if(!e||p.length<6)return toast("Enter email and a 6+ character password");const h=await sha(p);
if(au==="signup"){const n=$("#n").value.trim();if(!n)return toast("Enter your name");S.acct={email:e,hash:h,name:n};S.home=$("#h").value.trim()||"My Home";S.members[0].n=n;S.user=n}

return hd("Add Device")+tabs(["Scan QR","Manual"],pt,"setPt")+(pt==="Scan QR"?`<div class="cd" style="text-align:center"><div style="font-size:44px">📡</div><b>Searching for devices...</b><div class="mu">Real scanning needs a physical controller on the same network. Showing simulated nearby devices.</div><div class="dot" style="font-size:24px">● ● ●</div></div>`+F.map(([n,t,r])=>`<div class="cd row">${ic(t)}<div class="sp"><b>${n}</b><div class="mu">${r} · simulated</div></div><button onclick="addD('${n}','${r}','${t}')">Pair</button></div>`).join(""):`<div class="cd"><input type="text" id="pn" placeholder="Device name"><select id="pr">${ROOMS.map(r=>`<option>${r}</option>`).join("")}</select><select id="pt">${["light","fan","ac","tv","plug","curtain"].map(t=>`<option>${t}</option>`).join("")}</select><button onclick="addD($('#pn').value.trim(),$('#pr').value,$('#pt').value)">Pair</button></div>`)+`<div class="cd mu">Controller: <b>Simulator hub</b> (simulated). A real ESP32 controller would use authenticated MQTT over TLS with command IDs and acknowledgements. Mains devices need certified relays and professional installation.</div>`}
const setPt=x=>{pt=x;draw()};
function addD(n,r,t){if(!n)return toast("Enter a name");S.dev.push({id:uid(),name:n,room:r,type:t,on:false,online:true,fav:false,level:70,speed:3,temp:24,mode:"cool",vol:20,pos:50});save();note("Paired simulated device: "+n);toast(n+" paired");nav("list")}
function listV(){const l=S.dev.filter(d=>dl==="All"||d.room===dl&&1).filter(d=>d.name.toLowerCase().includes(fq.toLowerCase()));return hd("Devices",`<button class="o" onclick="go('pair')">+ Add</button>`)+`<input type="text" id="sq" placeholder="Search devices" value="${esc(fq)}" oninput="fq=this.value;clearTimeout(window.ft);window.ft=setTimeout(()=>{draw();const i=$('#sq');i&&(i.focus(),i.setSelectionRange(fq.length,fq.length))},250)">`+tabs(["All","Living Room","Bedroom","Kitchen"],dl,"setDl")+(l.map(d=>rowCard(d)).join("")||'<div class="mu">No devices match.</div>')}
const setDl=x=>{dl=x;draw()};
function houseV(){const A=(k,t,b)=>`<div class="cd lnk" onclick="acc=acc==='${k}'?null:'${k}';draw()"><div class="row"><span class="sp">${t}</span><span class="chev"></span></div></div>${acc===k?`<div class="cd">${b}</div>`:""}`;
return hd("Household Settings")+`<div class="cd row"><div class="ic" style="background:var(--ac);font-size:18px">${esc(S.user[0])}</div><div class="sp"><b>${esc(S.user)}</b><div class="mu">${S.role[0].toUpperCase()+S.role.slice(1)}</div></div></div>`+
A("m","👥 Household Members · "+S.members.length,S.members.map(m=>`<div class="row" style="margin-bottom:6px"><span class="sp">${esc(m.n)}</span><span class="tag">${m.r}</span></div>`).join("")+`<input type="text" id="mn" placeholder="New member name"><select id="mr"><option>member</option><option>viewer</option></select><button onclick="addM()">Add member</button>`)+
A("r","🏠 Rooms & Devices · "+S.dev.length,`<button onclick="nav('list')">Open device list</button>`)+
A("i","🔌 Integrations","<b>Ring</b>: demo simulator only (not a real connection).<br><b>Controller</b>: simulator hub.<br><b>AI</b>: offline rule engine.")+
A("s","🛡 Security & Privacy",`Your role in this demo (tests permissions):<select onchange="S.role=this.value;save();toast('Role: '+this.value);draw()">${["owner","member","viewer"].map(r=>`<option ${S.role===r?"selected":""}>${r}</option>`).join("")}</select><div class="mu">Viewer cannot control devices. Only owner can add members. All data stays on this device.</div>`)+
A("t","💧 Energy Tariff · ₹"+S.tariff+"/kWh",`<input type="number" step="0.1" value="${S.tariff}" onchange="S.tariff=+this.value||8;save();draw()">`)+
A("p","⚙️ App Settings",`<button class="o" onclick="thm()">Switch dark/light theme</button> <button class="bad" onclick="if(!window.rs){window.rs=1;toast('Tap again to reset all data');setTimeout(()=>window.rs=0,3000)}else{localStorage.removeItem('hp2');location.reload()}">Reset demo data</button>`)}
function addM(){if(S.role!=="owner")return toast("Only the owner can add members");const n=$("#mn").value.trim();if(!n)return toast("Enter a name");S.members.push({n,r:$("#mr").value});save();draw()}
function profV(){const A=(k,t,b)=>`<div class="cd lnk" onclick="acc=acc==='${k}'?null:'${k}';draw()"><div class="row"><span class="sp">${t}</span><span class="chev"></span></div></div>${acc===k?`<div class="cd">${b}</div>`:""}`;
return hd("Profile")+`<div class="cd row"><div class="ic" style="background:var(--ac)">${esc(S.user[0])}</div><div class="sp"><b>${esc(S.user)}</b><div class="mu">${esc(S.acct?S.acct.email:"")}</div></div></div>`+A("a","👤 Account Details",`<input type="text" id="un" value="${esc(S.user)}"><button onclick="S.user=$('#un').value.trim()||S.user;if(S.acct)S.acct.name=S.user;S.members[0].n=S.user;save();toast('Saved');draw()">Save name</button>`)+A("b","💳 Subscription · Free Plan","Free plan: all features in this demo are available. No payments are processed.")+A("h","❓ Help & Support","Run the app, open Automation to test rules, use the Ring page to simulate a motion event, and Settings to switch roles.")+A("u","ℹ️ About","HomePilot v1.0 demo. One Home. One App. Total Control. Simulated devices, offline, no API.")+`<button class="bad" style="width:100%" onclick="S.user=null;au='signin';save();nav('home')">Sign Out</button>`}
function moreV(){const L=[["list","📋 Device List"],["pair","📡 Add Device"],["assist","🤖 AI Assistant"],["ring","🔔 Ring Security"],["water","💧 Water Tank & Pump"],["notes","🔔 Notifications"],["house","⚙️ Household Settings"],["prof","👤 Profile"]];return hd("More")+L.map(([k,l])=>`<div class="cd lnk" style="font-size:16px" onclick="go('${k}')">${l}</div>`).join("")}
function thm(){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=S.theme;save()}
const SUBS={room:roomV,dev:devV,assist:assistV,ring:ringV,water:waterV,notes:notesV,pair:pairV,list:listV,house:houseV,prof:profV};
function draw(){const y=scrollY;if(!S.user){$("#app").innerHTML=au==="splash"?splashV():authV();return}
if(sub==="dev"&&!dev(sa)){sub=null}
let h=sub?SUBS[sub]():{home:homeV,rooms:roomsV,auto:autoV,ana:anaV,more:moreV}[tab]();
$("#app").innerHTML=h+`<nav><div>${[["home","🏠","Home"],["rooms","🚪","Rooms"],["auto","⚙️","Automation"],["ana","📊","Analytics"],["more","☰","More"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="nav('${k}')"><b>${i}</b>${l}</button>`).join("")}</div></nav>`+(csv?`<div class="m"><div><b>CSV report (simulated data)</b><textarea style="width:100%;height:180px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;margin:8px 0" readonly>${esc(csv)}</textarea><button onclick="try{navigator.clipboard.writeText(csv);toast('Copied')}catch(e){toast('Select and copy manually')}">Copy</button> <button class="o" onclick="csv=null;draw()">Close</button></div></div>`:"");scrollTo(0,y)}
document.documentElement.dataset.theme=S.theme||"dark";if(!S.acct&&S.user)S.user=null;
draw();setInterval(tick,2000);
</script></body></html>
