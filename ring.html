<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ring Demo Device</title>
<style>
:root{--bg:#050d1f;--cd:#0a1a3a;--tx:#eef4ff;--mu:#8ea4cc;--ac:#1e90ff;--cy:#22d3ee;--ok:#2ed589;--bd:#16305f;--wn:#ffb02e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:430px;margin:0 auto;padding:18px 16px 40px}h1{font-size:22px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.code{font:700 28px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;color:var(--cy);padding:10px 0;user-select:all}
button{font:inherit;background:linear-gradient(90deg,var(--ac),var(--cy));color:#fff;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;min-height:44px;width:100%;margin-top:8px}
button.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}button:disabled{opacity:.4;cursor:not-allowed}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--wn);color:var(--wn)}.st{font-weight:600}.ok{color:var(--ok)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px}
</style></head><body><main>
<h1>🔔 Ring Demo Device</h1><span class="tag">Simulator, not real Amazon Ring hardware</span>
<div class="cd"><div class="mu">Pairing code. Enter it in HomePilot → More → Ring Security → Sync Ring.</div><div class="code" id="code"></div>
<button class="o" onclick="copy()">Copy code</button><button class="o" onclick="regen()">Generate new code</button></div>
<div class="cd"><div class="mu">Status</div><div class="st" id="st"></div></div>
<div class="cd"><button id="bm" onclick="send('motion')">Send motion event</button><button id="bd" class="o" onclick="send('doorbell')">Press doorbell</button><div class="mu" style="margin-top:8px">Events reach HomePilot only after pairing. Both pages must be open in the same browser (this is a local demo, no server or API).</div></div>
<div class="cd"><div class="mu">Sent events</div><div id="log" class="mu">None yet.</div></div>
</main><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",K="hp_ring_code",P="hp_ring_paired";let log=[];
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const gen=()=>{const r=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>A[x%A.length]).join("");return"RING-"+r(4)+"-"+r(4)};
const bus=m=>ls("hp_bus",JSON.stringify({n:Math.random(),from:"ring",...m}));
let code=ls(K)||gen();ls(K,code);
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function ui(){const p=ls(P)===code;$("#code").textContent=code;$("#st").innerHTML=p?'<span class="ok">● Paired with HomePilot</span>':"○ Waiting for HomePilot to sync";$("#bm").disabled=$("#bd").disabled=!p;
$("#log").innerHTML=log.map(l=>l).join("<br>")||"None yet."}
function send(kind){bus({type:"event",code,kind});log.unshift(new Date().toLocaleTimeString()+" · "+(kind==="motion"?"Motion":"Doorbell")+" sent");log=log.slice(0,8);ui();toast("Event sent")}
function regen(){const old=code;code=gen();ls(K,code);ls(P,null);bus({type:"code",code,old});ui();toast("New code generated, old pairing removed")}
function copy(){try{navigator.clipboard.writeText(code);toast("Copied")}catch(e){toast("Select the code and copy it")}}
addEventListener("storage",e=>{if(e.key!=="hp_bus"||!e.newValue)return;let m;try{m=JSON.parse(e.newValue)}catch(x){return}if(m.from!=="app")return;
if(m.type==="pair"&&m.code===code){ls(P,code);bus({type:"paired",code,name:"Ring Doorbell (demo)"});ui();toast("Paired with HomePilot")}
if(m.type==="unpair"&&m.code===code){ls(P,null);ui()}
if(m.type==="newcode")regen();});
ui();
</script></body></html>
